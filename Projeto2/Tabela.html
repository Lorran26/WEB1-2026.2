<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informações do Usuário</title>
</head>
<body>

    <h1>Informações do Usuário</h1>

    <table border="2px">
        <tr>
            <th>Informação</th>
            <th>Dados</th>
        </tr>

        <tr>
            <td>Nome completo:</td>
            <td><input type="text" id="nome" name="nome" required></td>
        </tr>

        <tr>
            <td>Data de nascimento:</td>
            <td><input type="date" id="fdate" name="fdate"></td>
        </tr>

        <tr>
            <td>CEP</td>
            <td><input type="text" id="fname" name="fname"> </td>
        </tr>

        <tr>
            <td>Cor Favorita</td>
            <td><input type="color" id="color" name="color"></td>
        </tr>

        <tr>
            <td>Endereço</td>
            <td><input type="text" id="name" name="fname"></td>
        </tr>

        <tr>
            <td>Cidade</td>
            <td><input type="text" id="qname" name="fname"></td>
        </tr>

         <tr>
            <td>Bairro</td>
            <td><input type="text" id="cname" name="fname"> </td>
        </tr>
    </table>
</body>
</html>
